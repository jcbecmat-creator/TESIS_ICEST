<section id="proyecciones">
    <h3 class="mb-4 text-secondary">Carga de Proyecciones (Bontrager)</h3>
    <div class="card card-custom p-4">
        <form>
            <div class="mb-3">
                <label>Archivo CSV de Datos</label>
                <input type="file" class="form-control" accept=".csv">
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6"><label>Imagen Técnica 1</label><input type="file" class="form-control"></div>
                <div class="col-md-6"><label>Imagen Técnica 2 (Opcional)</label><input type="file" class="form-control"></div>
                <div class="col-md-6"><label>Imagen Radiográfica 1</label><input type="file" class="form-control"></div>
                <div class="col-md-6"><label>Imagen Radiográfica 2 (Opcional)</label><input type="file" class="form-control"></div>
            </div>
            <button type="button" class="btn btn-theme w-100">Cargar Nueva Proyección</button>
        </form>
    </div>
</section>
