<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --icest-blue: #005B9A; --icest-dark: #003f6b; --loreto-cyan: #81D0DC; --bg-light: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; }
        body { font-family: 'Lato', sans-serif; color: var(--text-main); margin: 0; padding: 40px; display: flex; justify-content: center; background: transparent; }
        h3 { font-family: 'Poppins'; color: var(--icest-blue); margin-bottom: 5px; }
        .slide-card { background: white; border-radius: 12px; padding: 50px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); border-top: 5px solid var(--icest-blue); width: 100%; max-width: 1100px; }
        .slide-title { font-size: 32px; font-family: 'Poppins'; margin-bottom: 30px; border-bottom: 2px solid var(--loreto-cyan); padding-bottom: 10px; color: var(--icest-blue); }
        .two-column { display: flex; gap: 40px; align-items: center; }
        .col { flex: 1; }
        
        @media (max-width: 768px) {
            body { padding: 15px; }
            .slide-card { padding: 25px 20px; }
            .slide-title { font-size: 24px; margin-bottom: 20px; }
            .two-column { flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>
    <div class="slide-card">
        <h2 class="slide-title">Perfil del Paciente</h2>
        <div class="two-column">
            <div class="col" style="text-align: center;">
                <div style="width: 180px; height: 180px; border-radius: 50%; border: 6px solid var(--icest-blue); margin: 0 auto 15px; background-color: var(--bg-light); display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-user" style="font-size: 70px; color: var(--loreto-cyan);"></i>
                </div>
                <h3>Juan Carlos Becerra</h3>
                <p style="color: var(--loreto-cyan); font-weight: 700;">Paciente Activo</p>
            </div>
            <div class="col" style="background: var(--bg-light); padding: 30px; border-radius: 12px; border-left: 5px solid var(--icest-blue);">
                <p style="margin-bottom: 15px; font-size: 16px;"><strong>Folio Oficial:</strong> ICEST-123456</p>
                <p style="margin-bottom: 15px; font-size: 16px;"><strong>CURP:</strong> BEJU900101H</p>
                <p style="font-size: 16px;"><strong>Privilegios:</strong> Radiología</p>
            </div>
        </div>
    </div>
</body>
</html>
