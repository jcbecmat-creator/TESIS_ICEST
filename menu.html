<section id="login" class="app-section active">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card card-custom p-5 text-center shadow" style="max-width: 400px; width: 100%; border-top: 5px solid #81D0DC;">
            <i class="fas fa-user-shield fa-3x mb-3" style="color: #81D0DC;"></i>
            <h4 class="mb-4">Acceso al Sistema</h4>
            <input type="text" id="user-id" class="form-control mb-3" placeholder="Ingrese su ID (Ej. ICEST-1)">
            <button class="btn btn-theme w-100 py-2" onclick="iniciarSesion()" style="background-color: #81D0DC; color: white; border: none; border-radius: 25px;">Ingresar</button>
        </div>
    </div>
</section>

<script>
    /**
     * Función Maestra de Navegación
     * Controla la visibilidad de los 11 códigos creados
     */
    function navegar(seccionId) {
        // Ocultar todas las secciones de la aplicación
        const secciones = document.querySelectorAll('.app-section');
        secciones.forEach(sec => {
            sec.style.display = 'none';
            sec.classList.remove('active');
        });

        // Mostrar la sección seleccionada
        const destino = document.getElementById(seccionId);
        if (destino) {
            destino.style.display = 'block';
            destino.classList.add('active');
            window.scrollTo(0, 0);
        }

        // Cerrar el menú desplegable en dispositivos móviles tras clic
        const navbarCollapse = document.getElementById('navbarNav');
        if (navbarCollapse && navbarCollapse.classList.contains('show')) {
            const bsCollapse = new bootstrap.Collapse(navbarCollapse, { toggle: false });
            bsCollapse.hide();
        }
    }

    /**
     * Lógica de Inicio de Sesión
     */
    function iniciarSesion() {
        const id = document.getElementById('user-id').value;
        if (id.trim() !== "") {
            // Activar Menú y ocultar Login
            document.getElementById('main-nav').style.display = 'block';
            navegar('inicio');
            alert("Bienvenido al sistema de triaje ICEST.");
        } else {
            alert("Por favor ingrese un ID válido.");
        }
    }

    /**
     * Lógica de Cierre de Sesión
     */
    function cerrarSesion() {
        if(confirm("¿Desea finalizar su sesión actual?")) {
            document.getElementById('main-nav').style.display = 'none';
            document.getElementById('user-id').value = '';
            navegar('login');
        }
    }

    /**
     * Inicialización de Fecha Actual (Formato Mexicano)
     */
    function mostrarFecha() {
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const hoy = new Date().toLocaleDateString('es-MX', opciones);
        document.getElementById('fecha-actual').innerText = hoy;
    }

    // Ejecutar al cargar la página
    window.onload = mostrarFecha;
</script>
