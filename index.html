<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Educativo - ICEST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --icest-blue: #0073B2; /* Azul del fondo ICEST */
            --icest-dark: #002D5A; /* Azul oscuro para textos */
            --loreto-cyan: #81D0DC; /* Color de los iconos Loreto */
            --input-bg: #E8F0FE; /* Fondo claro de los inputs */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--icest-blue);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        /* ==========================================
           ESTILOS DEL LOGIN (TIPO ICEST + LORETO)
        ========================================== */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-title {
            color: var(--icest-dark);
            font-weight: bold;
            font-size: 28px;
            margin-top: 15px;
            margin-bottom: 0;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Estilo de Inputs tipo Loreto */
        .input-group-text-custom {
            background-color: var(--input-bg);
            border: 1px solid #ced4da;
            border-right: none;
            color: var(--loreto-cyan);
        }

        .form-control-custom {
            background-color: var(--input-bg);
            border: 1px solid #ced4da;
            border-left: none;
        }
        
        .form-control-custom:focus {
            background-color: white;
            box-shadow: none;
            border-color: var(--loreto-cyan);
        }

        .input-eye {
            background-color: var(--input-bg);
            border: 1px solid #ced4da;
            border-left: none;
            color: var(--loreto-cyan);
            cursor: pointer;
        }

        .btn-login {
            background-color: var(--icest-dark);
            color: white;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #004280;
            color: white;
        }

        /* ==========================================
           ESTILOS DEL FOOTER Y NAVBAR
        ========================================== */
        .footer-custom {
            background-color: var(--icest-dark);
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .navbar-custom { background-color: var(--loreto-cyan); }
        .app-section { display: none; }
        .app-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <section id="login" class="app-section active">
        <div class="login-wrapper">
            <div class="card login-card">
                <img src="https://www.icest.edu.mx/images/logo-icest.png" alt="ICEST Logo" style="max-width: 160px; margin: 0 auto;">
                
                <h1 class="login-title">Bienvenido</h1>
                <p class="login-subtitle">Portal de Educación Profesional</p>
                
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold" style="color: var(--icest-dark);">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-id-badge"></i></span>
                        <input type="text" id="userId" class="form-control form-control-custom" placeholder="Ej. 123">
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold" style="color: var(--icest-dark);">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-lock"></i></span>
                        <input type="password" id="userPass" class="form-control form-control-custom" placeholder="•••••">
                        <span class="input-group-text input-eye" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>

                <button id="btnLogin" class="btn btn-login w-100" onclick="validarIngresoGAS()">Verificando...</button>
            </div>
        </div>
    </section>

    <div id="sistemaInterno" style="display: none; flex: 1; background-color: #f4f7f6;">
        <nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand text-white fw-bold" href="#"><i class="fas fa-brain me-2"></i> IA-TRIAGE</a>
                <div class="d-flex align-items-center ms-auto">
                    <span id="userNameDisplay" class="text-white me-3 fw-bold"></span>
                    <button class="btn btn-sm btn-outline-light rounded-pill" onclick="location.reload()">Salir</button>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <h3 style="color: var(--icest-dark);">Dashboard Principal</h3>
            <div class="card p-4 mt-3 border-0 shadow-sm" style="border-top: 4px solid var(--loreto-cyan);">
                <p>Sesión validada exitosamente desde Google Apps Script.</p>
                <p><b>ID Activo:</b> <span id="activeUserId"></span></p>
                </div>
        </div>
    </div>

    <footer class="footer-custom">
        © 2026 ICEST. TODOS LOS DERECHOS RESERVADOS.
    </footer>

    <script>
        // Función para cambiar el estado del botón al cargar inicialmente
        window.onload = function() {
            document.getElementById('btnLogin').innerText = "INGRESAR";
        };

        // Función para Mostrar/Ocultar Contraseña (El Ojo)
        function togglePassword() {
            const passInput = document.getElementById('userPass');
            const icon = document.getElementById('toggleIcon');
            
            if (passInput.type === "password") {
                passInput.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passInput.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Validación Real con Google Apps Script (Fetch)
        async function validarIngresoGAS() {
            const username = document.getElementById('userId').value.trim();
            const password = document.getElementById('userPass').value.trim();
            const btn = document.getElementById('btnLogin');

            if (!username || !password) {
                alert("Por favor, ingrese su usuario y contraseña.");
                return;
            }

            // Cambiar estado del botón
            btn.innerText = "Verificando...";
            btn.disabled = true;

            // URL proporcionada de tu Script
            const urlGAS = "https://script.google.com/macros/s/AKfycbzKt5qEd2eXYqKt9hLlNNxN7_LEKJVmShW1mD6ogZrNDC02hqSQBZdTHrzd-i_HfKs/exec";

            try {
                // Configuración de la petición POST. 
                // NOTA: Usamos text/plain para evitar errores de CORS desde GitHub Pages
                const respuesta = await fetch(urlGAS, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const resultado = await respuesta.json();

                if (resultado.acceso === true) {
                    // Si el script de Google dice "true", damos acceso
                    document.getElementById('login').style.display = 'none';
                    document.body.style.backgroundColor = '#f4f7f6'; // Cambia el fondo a gris claro para la app
                    document.getElementById('sistemaInterno').style.display = 'block';
                    
                    document.getElementById('userNameDisplay').innerText = "Usuario: " + username;
                    document.getElementById('activeUserId').innerText = username;
                } else {
                    // Si dice "false", las credenciales no coinciden en el Excel
                    alert("Credenciales incorrectas. Verifique los datos en su tabla.");
                    btn.innerText = "INGRESAR";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Error en la conexión:", error);
                alert("Hubo un error al conectar con la base de datos de Google Sheets.");
                btn.innerText = "INGRESAR";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
