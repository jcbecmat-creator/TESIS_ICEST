<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Educativo - ICEST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --icest-blue-bg: #0076B6; /* Azul brillante del fondo */
            --icest-dark: #002D5A;    /* Azul oscuro para botón y footer */
            --loreto-cyan: #72C5D3;   /* Color cyan de los iconos */
            --input-bg: #EAF0F6;      /* Fondo clarito de los inputs */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--icest-blue-bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        /* ==========================================
           CONTENEDOR CENTRAL Y TARJETA
        ========================================== */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 15px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        .login-title {
            color: var(--icest-dark);
            font-weight: 800;
            font-size: 26px;
            margin-top: 15px;
            margin-bottom: 2px;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* ==========================================
           INPUTS ESTILO LORETO
        ========================================== */
        .form-label-custom {
            color: var(--icest-dark);
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 5px;
            display: block;
            text-align: left;
        }

        .input-group-custom {
            border: 1px solid #ced4da;
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--input-bg);
        }

        .input-group-text-custom {
            background-color: transparent;
            border: none;
            color: var(--loreto-cyan);
            padding-right: 5px;
        }

        .form-control-custom {
            background-color: transparent;
            border: none;
            box-shadow: none !important;
            font-weight: 500;
            color: #333;
        }

        .input-eye {
            background-color: transparent;
            border: none;
            color: var(--loreto-cyan);
            cursor: pointer;
        }

        /* ==========================================
           BOTÓN Y FOOTER
        ========================================== */
        .btn-login {
            background-color: var(--icest-dark);
            color: white;
            border-radius: 6px;
            padding: 10px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
            border: none;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #001f3f;
            color: white;
        }

        .footer-custom {
            background-color: var(--icest-dark);
            color: white;
            text-align: center;
            padding: 12px 0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Control de Vistas SPA */
        .app-section { display: none; }
        .app-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <section id="login" class="app-section active">
        <div class="login-wrapper">
            <div class="card login-card">
                
                <img src="https://www.icest.edu.mx/images/logo-icest.png" alt="ICEST Logo" style="max-width: 150px; margin: 0 auto;">
                
                <h1 class="login-title">Bienvenido</h1>
                <p class="login-subtitle">Portal de Educación Profesional</p>
                
                <div class="mb-3">
                    <label class="form-label-custom">Usuario</label>
                    <div class="input-group input-group-custom d-flex align-items-center">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-id-badge"></i></span>
                        <input type="text" id="userId" class="form-control form-control-custom" placeholder="Ej. OITM">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label-custom">Contraseña</label>
                    <div class="input-group input-group-custom d-flex align-items-center">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-lock"></i></span>
                        <input type="password" id="userPass" class="form-control form-control-custom" placeholder="•••••">
                        <span class="input-group-text input-eye" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>

                <button id="btnLogin" class="btn btn-login w-100" onclick="validarIngresoGAS()">INGRESAR</button>
            </div>
        </div>
    </section>

    <div id="sistemaInterno" style="display: none; flex: 1; background-color: #f4f7f6;">
        <nav class="navbar navbar-expand-lg shadow-sm sticky-top" style="background-color: var(--loreto-cyan);">
            <div class="container-fluid">
                <a class="navbar-brand text-white fw-bold" href="#"><i class="fas fa-microchip me-2"></i> IA-TRIAGE ICEST</a>
                <div class="d-flex align-items-center ms-auto">
                    <span id="userNameDisplay" class="text-white me-3 fw-bold small"></span>
                    <button class="btn btn-sm btn-light rounded-pill fw-bold" style="color: var(--icest-dark);" onclick="location.reload()">Salir</button>
                </div>
            </div>
        </nav>

        <div class="container mt-5 text-center">
            <h2 style="color: var(--icest-dark);">¡Acceso Concedido!</h2>
            <p>ID de sesión activa: <strong id="activeUserId"></strong></p>
            <p class="text-muted">La conexión con Google Apps Script fue exitosa.</p>
        </div>
    </div>

    <footer class="footer-custom" id="mainFooter">
        © 2026 ICEST. TODOS LOS DERECHOS RESERVADOS.
    </footer>

    <script>
        // Función Mostrar/Ocultar Contraseña
        function togglePassword() {
            const passInput = document.getElementById('userPass');
            const icon = document.getElementById('toggleIcon');
            
            if (passInput.type === "password") {
                passInput.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passInput.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Validación con API Google Apps Script
        async function validarIngresoGAS() {
            const username = document.getElementById('userId').value.trim();
            const password = document.getElementById('userPass').value.trim();
            const btn = document.getElementById('btnLogin');

            if (!username || !password) {
                alert("Por favor, ingrese su usuario y contraseña.");
                return;
            }

            // Animación del botón
            btn.innerText = "Verificando...";
            btn.disabled = true;

            const urlGAS = "https://script.google.com/macros/s/AKfycbzKt5qEd2eXYqKt9hLlNNxN7_LEKJVmShW1mD6ogZrNDC02hqSQBZdTHrzd-i_HfKs/exec";

            try {
                const respuesta = await fetch(urlGAS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ username: username, password: password })
                });

                const resultado = await respuesta.json();

                if (resultado.acceso === true) {
                    // ÉXITO: Ocultar login, mostrar sistema
                    document.getElementById('login').style.display = 'none';
                    document.getElementById('mainFooter').style.display = 'none'; // Ocultar footer si se desea
                    document.body.style.backgroundColor = '#f4f7f6';
                    document.getElementById('sistemaInterno').style.display = 'block';
                    
                    document.getElementById('userNameDisplay').innerText = username;
                    document.getElementById('activeUserId').innerText = username;
                } else {
                    // FALLO
                    alert("Credenciales incorrectas. Verifique los datos.");
                    btn.innerText = "INGRESAR";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error de red al contactar la base de datos.");
                btn.innerText = "INGRESAR";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
