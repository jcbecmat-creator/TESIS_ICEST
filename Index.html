<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Portal Educativo - ICES</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#005B9A", 
                        "primary-dark": "#004575",
                        "surface": "#FFFFFF",
                        "text-main": "#1E293B",
                        "text-sub": "#64748B",
                    }
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #007bc4; /* Color sólido azul de fondo según imagen 1 */
            margin: 0;
            padding: 0;
        }
        .login-card {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        input:focus {
            ring: 2px solid rgba(0, 91, 154, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased">
    
    <div class="w-full max-w-[440px] bg-surface rounded-[20px] login-card overflow-hidden">
        <div class="p-10">
            <div class="flex flex-col items-center mb-8">
                <img src="https://i.ibb.co/C3wh0NmV/hq720.jpg" alt="Logo ICES" class="mb-2 object-contain" style="height: 100px;"> 
                <h1 class="text-[28px] font-bold text-[#1a2b4b] mt-4">Bienvenido</h1>
                <p class="text-[16px] text-[#718096]">Portal de Educación Profesional</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[15px] font-semibold text-slate-700" for="username">Usuario</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person_outline</span>
                        <input required id="username" name="username" placeholder="ID" type="text"
                            class="block w-full pl-12 pr-4 py-3.5 bg-white border border-slate-200 rounded-xl text-text-main placeholder-slate-400 focus:border-primary focus:ring-0 transition-all outline-none">
                    </div>
                </div>
                
                <div class="space-y-2">
                    <label class="text-[15px] font-semibold text-slate-700" for="password">Contraseña</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock_open</span>
                        <input required id="password" name="password" placeholder="••••••••" type="password"
                            class="block w-full pl-12 pr-12 py-3.5 bg-white border border-slate-200 rounded-xl text-text-main placeholder-slate-400 focus:border-primary focus:ring-0 transition-all outline-none">
                        <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors">
                            <span class="material-symbols-outlined" id="toggleIcon">visibility_off</span>
                        </button>
                    </div>
                </div>
                
                <div class="flex justify-end">
                    <a class="text-[14px] font-semibold text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <div id="alertMessage" class="hidden py-3 px-4 bg-red-50 border border-red-100 text-red-600 text-sm font-medium rounded-xl text-center">
                    Verifica tu ID o contraseña
                </div>
                
                <button id="submitBtn" type="submit"
                    class="w-full py-4 px-4 rounded-xl text-[16px] font-bold text-white bg-primary hover:bg-primary-dark shadow-md transition-all active:scale-[0.98]">
                    Iniciar Sesión
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-slate-50 text-center">
                <p class="text-[14px] text-text-sub">
                    ¿Necesitas ayuda? 
                    <a class="font-bold text-primary hover:underline ml-1" href="#">Contactar Soporte</a>
                </p>
            </div>
        </div>
    </div>
    
    <div class="mt-8 text-center px-4">
        <p class="text-[11px] font-bold tracking-tighter text-white opacity-80 uppercase">
            © 2024 ICES MÉXICO. TODOS LOS DERECHOS RESERVADOS.
        </p>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const alertMessage = document.getElementById('alertMessage');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            alertMessage.classList.add('hidden');
            submitBtn.innerText = 'Verificando...';
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";

            google.script.run
                .withSuccessHandler(function(esValido) {
                    if (esValido) {
                        // Redirección al tener éxito
                        window.top.location.href = 'https://www.youtube.com';
                    } else {
                        alertMessage.classList.remove('hidden');
                        restaurarBoton();
                    }
                })
                .withFailureHandler(function(error) {
                    alertMessage.innerText = "Error de conexión.";
                    alertMessage.classList.remove('hidden');
                    restaurarBoton();
                })
                .verificarCredenciales(username, password);
                
            function restaurarBoton() {
                submitBtn.innerText = 'Iniciar Sesión';
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
