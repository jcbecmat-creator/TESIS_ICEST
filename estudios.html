<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --icest-blue: #005B9A; --icest-dark: #003f6b; --loreto-cyan: #81D0DC; --bg-light: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; }
        body { font-family: 'Lato', sans-serif; color: var(--text-main); margin: 0; padding: 40px; display: flex; justify-content: center; background: transparent; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; color: var(--icest-blue); margin-bottom: 15px; }
        .slide-card { background: white; border-radius: 12px; padding: 50px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); border-top: 5px solid var(--icest-blue); width: 100%; max-width: 1100px; }
        .slide-title { font-size: 32px; font-weight: 400; margin-bottom: 30px; border-bottom: 2px solid var(--loreto-cyan); padding-bottom: 10px; color: var(--icest-blue); }
        .btn-primary { background-color: var(--icest-blue); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; font-family: 'Poppins'; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background-color: var(--icest-dark); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: var(--icest-blue); color: white; font-family: 'Poppins'; }
    </style>
</head>
<body>
    <div class="slide-card">
        <h2 class="slide-title">Cola de Estudios Radiológicos</h2>
        <table>
            <thead><tr><th>Prioridad IA</th><th>Folio Paciente</th><th>Estudio Solicitado</th><th>Acción Requerida</th></tr></thead>
            <tbody>
                <tr>
                    <td><span style="background-color: #ef4444; color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold;">Urgencia</span></td>
                    <td style="font-weight: bold;">ICEST-115</td><td>Tobillo Lateral</td>
                    <td><button class="btn-primary" style="padding: 8px 15px; font-size: 13px;"><i class="fa-solid fa-upload"></i> Subir DICOM</button></td>
                </tr>
                <tr>
                    <td><span style="background-color: var(--icest-blue); color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold;">Normal</span></td>
                    <td style="font-weight: bold;">ICEST-246</td><td>Muñeca PA</td>
                    <td><button class="btn-primary" style="padding: 8px 15px; font-size: 13px;"><i class="fa-solid fa-upload"></i> Subir DICOM</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
