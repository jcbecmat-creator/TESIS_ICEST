<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--icest-blue:#005B9A;--icest-dark:#003f6b;--loreto-cyan:#81D0DC;--bg-light:#f8fafc;--text-main:#1e293b;--text-muted:#64748b}body{font-family:'Lato',sans-serif;color:var(--text-main);margin:0;padding:40px;display:flex;justify-content:center;background:transparent}.slide-card{background:white;border-radius:12px;padding:50px;box-shadow:0 15px 30px rgba(0,0,0,0.05);border-top:5px solid var(--icest-blue);width:100%;max-width:1100px}.slide-title{font-size:32px;font-family:'Poppins';margin-bottom:30px;border-bottom:2px solid var(--loreto-cyan);padding-bottom:10px;color:var(--icest-blue)}.btn-primary{background-color:var(--icest-blue);color:white;border:none;padding:10px 15px;border-radius:6px;font-weight:700;font-family:'Poppins';cursor:pointer;transition:0.3s;font-size:13px}.btn-primary:hover{background-color:var(--icest-dark)}.table-responsive{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:10px;min-width:650px}th,td{padding:15px;text-align:left;border-bottom:1px solid #e2e8f0}th{background-color:var(--icest-blue);color:white;font-family:'Poppins';font-size:14px}@media(max-width:768px){body{padding:15px}.slide-card{padding:25px 20px}.slide-title{font-size:24px;margin-bottom:20px}}
    </style>
</head>
<body>
    <div class="slide-card">
        <h2 class="slide-title">Cola de Estudios Radiológicos</h2>
        <div class="table-responsive">
            <table>
                <thead><tr><th>Prioridad IA</th><th>Folio Paciente</th><th>Estudio Solicitado</th><th>Acción Requerida</th></tr></thead>
                <tbody>
                    <tr>
                        <td><span style="background-color: #ef4444; color: white; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold;">Urgencia Alta</span></td>
                        <td style="font-weight: bold;">ICEST-115</td><td>Tobillo Lateral (Ruta A)</td>
                        <td><button class="btn-primary"><i class="fa-solid fa-upload"></i> Subir DICOM</button></td>
                    </tr>
                    <tr>
                        <td><span style="background-color: var(--icest-blue); color: white; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold;">Normal</span></td>
                        <td style="font-weight: bold;">ICEST-246</td><td>Muñeca PA (Ruta C)</td>
                        <td><button class="btn-primary"><i class="fa-solid fa-upload"></i> Subir DICOM</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        const app = initializeApp({ apiKey: "AIzaSyBALDQWfTsBsoev0bNTEiatzGVkfrxEhB4", authDomain: "icest-tesis.firebaseapp.com", projectId: "icest-tesis", storageBucket: "icest-tesis.firebasestorage.app", messagingSenderId: "740005254003", appId: "1:740005254003:web:abc24c84156d1f9e696b06" });
        window.db = getFirestore(app);
    </script>
</body>
</html>
