<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--icest-blue:#005B9A;--icest-dark:#003f6b;--loreto-cyan:#81D0DC;--bg-light:#f8fafc;--text-main:#1e293b;--text-muted:#64748b}
        body{font-family:'Lato',sans-serif;color:var(--text-main);margin:0;padding:40px;display:flex;justify-content:center;background:transparent}
        h3{font-family:'Poppins';color:var(--icest-blue);margin-bottom:15px}
        .slide-card{background:white;border-radius:12px;padding:40px;box-shadow:0 15px 30px rgba(0,0,0,0.05);border-top:5px solid var(--icest-blue);width:100%;max-width:1100px}
        .slide-title{font-size:30px;font-family:'Poppins';margin-bottom:25px;border-bottom:2px solid var(--loreto-cyan);padding-bottom:10px;color:var(--icest-blue)}
        
        .form-control{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-family:'Lato';background-color:var(--bg-light);font-size:14px;box-sizing:border-box}
        .form-control:focus{border-color:var(--loreto-cyan);outline:none;background-color:white;box-shadow:0 0 0 3px rgba(129,208,220,0.2)}
        .form-label{display:block;font-weight:700;margin-bottom:6px;font-size:13px;color:var(--text-muted);text-align:left}
        
        .btn-primary{background-color:var(--icest-blue);color:white;border:none;padding:14px 28px;border-radius:8px;font-weight:700;font-family:'Poppins';cursor:pointer;transition:0.3s;margin-top:20px;width:100%;font-size:16px}
        .btn-primary:hover{background-color:var(--icest-dark);transform:translateY(-2px)}
        
        .btn-clear{background-color:#cbd5e1;color:var(--icest-dark);border:none;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-top:10px;transition:0.3s; display:inline-flex; align-items:center; gap:5px;}
        .btn-clear:hover{background-color:#94a3b8}

        .form-row{display:flex;gap:25px;margin-bottom:20px;width:100%}
        .form-col{flex:1;min-width:0}

        .section-header{margin-top:30px;padding-bottom:8px;border-bottom:1px solid #e2e8f0;margin-bottom:20px;color:var(--icest-dark);font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
        .section-header i{color:var(--loreto-cyan);font-size:18px}

        /* Contenedores Multimedia Interactivos */
        .capture-box{border:2px dashed #cbd5e1;height:220px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:white;position:relative;overflow:hidden;width:100%;}
        .signature-line{position:absolute;bottom:40px;width:80%;border-bottom:2px solid var(--icest-dark); pointer-events:none;}
        
        @media(max-width:768px){
            body{padding:15px}
            .slide-card{padding:25px 20px}
            .slide-title{font-size:24px}
            .form-row{flex-direction:column;gap:15px;margin-bottom:15px}
        }
    </style>
</head>
<body>
    <div class="slide-card">
        <h2 class="slide-title">Registro de Nuevo Ingreso</h2>
        
        <form id="registroPaciente">
            <div class="section-header"><i class="fa-solid fa-user"></i> Datos Personales</div>
            
            <div class="form-row">
                <div class="form-col">
                    <label class="form-label">Nombre(s)</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ej. JUAN CARLOS" required>
                </div>
                <div class="form-col">
                    <label class="form-label">Apellido Paterno</label>
                    <input type="text" id="apellidoPaterno" class="form-control" placeholder="Ej. PÉREZ" required>
                </div>
                <div class="form-col">
                    <label class="form-label">Apellido Materno</label>
                    <input type="text" id="apellidoMaterno" class="form-control" placeholder="Ej. HERNÁNDEZ" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col">
                    <label class="form-label">CURP</label>
                    <input type="text" id="curp" class="form-control" placeholder="18 CARACTERES" required>
                </div>
                <div class="form-col">
                    <label class="form-label">Sexo</label>
                    <select id="sexo" class="form-control" required>
                        <option value="">Seleccione...</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
                <div class="form-col">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" id="fechaNac" class="form-control" required>
                </div>
            </div>

            <div class="section-header"><i class="fa-solid fa-house-medical"></i> Domicilio del Paciente</div>
            <div class="form-row">
                <div class="form-col"><label class="form-label">Calle y Números</label><input type="text" id="calle" class="form-control" placeholder="NOMBRE DE LA VIALIDAD"></div>
                <div class="form-col"><label class="form-label">Número Exterior / Interior</label><input type="text" id="numExt" class="form-control" placeholder="EJ. 123-A O S/N"></div>
            </div>
            <div class="form-row">
                <div class="form-col"><label class="form-label">Colonia</label><input type="text" id="colonia" class="form-control" placeholder="NOMBRE DEL ASENTAMIENTO"></div>
                <div class="form-col"><label class="form-label">Delegación o Municipio</label><input type="text" id="municipio" class="form-control" placeholder="MUNICIPIO"></div>
            </div>
            <div class="form-row">
                <div class="form-col"><label class="form-label">Código Postal</label><input type="number" id="cp" class="form-control" placeholder="5 DÍGITOS"></div>
                <div class="form-col">
                    <label class="form-label">Estado</label>
                    <select id="estado" class="form-control">
                        <option value="">Seleccione un estado...</option>
                        <option value="AGUASCALIENTES">Aguascalientes</option>
                        <option value="BAJA CALIFORNIA">Baja California</option>
                        <option value="BAJA CALIFORNIA SUR">Baja California Sur</option>
                        <option value="CAMPECHE">Campeche</option>
                        <option value="CHIAPAS">Chiapas</option>
                        <option value="CHIHUAHUA">Chihuahua</option>
                        <option value="CIUDAD DE MÉXICO">Ciudad de México</option>
                        <option value="COAHUILA">Coahuila</option>
                        <option value="COLIMA">Colima</option>
                        <option value="DURANGO">Durango</option>
                        <option value="ESTADO DE MÉXICO">Estado de México</option>
                        <option value="GUANAJUATO">Guanajuato</option>
                        <option value="GUERRERO">Guerrero</option>
                        <option value="HIDALGO">Hidalgo</option>
                        <option value="JALISCO">Jalisco</option>
                        <option value="MICHOACÁN">Michoacán</option>
                        <option value="MORELOS">Morelos</option>
                        <option value="NAYARIT">Nayarit</option>
                        <option value="NUEVO LEÓN">Nuevo León</option>
                        <option value="OAXACA">Oaxaca</option>
                        <option value="PUEBLA">Puebla</option>
                        <option value="QUERÉTARO">Querétaro</option>
                        <option value="QUINTANA ROO">Quintana Roo</option>
                        <option value="SAN LUIS POTOSÍ">San Luis Potosí</option>
                        <option value="SINALOA">Sinaloa</option>
                        <option value="SONORA">Sonora</option>
                        <option value="TABASCO">Tabasco</option>
                        <option value="TAMAULIPAS">Tamaulipas</option>
                        <option value="TLAXCALA">Tlaxcala</option>
                        <option value="VERACRUZ">Veracruz</option>
                        <option value="YUCATÁN">Yucatán</option>
                        <option value="ZACATECAS">Zacatecas</option>
                    </select>
                </div>
            </div>

            <div class="section-header"><i class="fa-solid fa-fingerprint"></i> Biometría y Consentimiento</div>
            <div class="form-row">
                
                <div class="form-col" style="text-align: center; background: var(--bg-light); padding: 20px; border-radius: 12px;">
                    <label class="form-label" style="text-align: center;">Fotografía (Selfie)</label>
                    
                    <div class="capture-box" id="cameraContainer">
                        <div id="cameraUI" style="z-index: 3; pointer-events: none;">
                            <i class="fa-solid fa-camera" style="font-size: 45px; color: var(--icest-blue); margin-bottom: 10px;"></i>
                            <div style="color: var(--text-muted); font-weight: 700;">Área de Captura</div>
                        </div>
                        
                        <video id="videoElement" autoplay playsinline style="display:none; width:100%; height:100%; object-fit:cover; position:absolute; z-index:1;"></video>
                        <canvas id="canvasElement" style="display:none;"></canvas>
                        <img id="photoPreview" style="display:none; width:100%; height:100%; object-fit:cover; position:absolute; z-index:2;">
                    </div>
                    
                    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px;">
                        <button type="button" class="btn-clear" id="btnActivarCam"><i class="fa-solid fa-video"></i> Cámara</button>
                        <button type="button" class="btn-clear" id="btnTomarFoto" style="display:none; background-color: var(--icest-blue); color: white;"><i class="fa-solid fa-camera"></i> Capturar</button>
                        <button type="button" class="btn-clear" id="btnGirarCam"><i class="fa-solid fa-rotate"></i> Girar</button>
                        <button type="button" class="btn-clear" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-upload"></i> Subir</button>
                        <button type="button" class="btn-clear" onclick="limpiarFoto()"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="subirFotoArchivo(event)">
                </div>

                <div class="form-col" style="text-align: center; background: var(--bg-light); padding: 20px; border-radius: 12px;">
                    <label class="form-label" style="text-align: center;">Firma del Paciente</label>
                    
                    <div class="capture-box" style="border-style: solid; background-color: white; padding: 0;">
                        <canvas id="signatureCanvas" style="width: 100%; height: 100%; position: absolute; z-index: 2; touch-action: none; cursor: crosshair;"></canvas>
                        
                        <i class="fa-solid fa-pen-nib" style="position: absolute; top: 15px; right: 15px; font-size: 20px; color: #cbd5e1; z-index: 1;"></i>
                        <div class="signature-line" style="z-index: 1;"></div>
                        <span style="position: absolute; bottom: 15px; font-size: 12px; color: var(--text-muted); z-index: 1; pointer-events: none;">Firmar con el dedo o ratón</span>
                    </div>
                    
                    <div style="display: flex; justify-content: center; margin-top: 10px;">
                        <button type="button" class="btn-clear" onclick="limpiarFirma()"><i class="fa-solid fa-eraser"></i> Limpiar firma</button>
                    </div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" id="btnGuardar" class="btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Registro y Generar ID
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-storage.js";

        // ==========================================
        // REGLA: FORZAR MAYÚSCULAS EN TIEMPO REAL
        // ==========================================
        document.addEventListener('input', function(e) {
            if(e.target.tagName.toLowerCase() === 'input' && e.target.type === 'text') {
                e.target.value = e.target.value.toUpperCase();
            }
        });

        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBALDQWfTsBsoev0bNTEiatzGVkfrxEhB4",
            authDomain: "icest-tesis.firebaseapp.com",
            projectId: "icest-tesis",
            storageBucket: "icest-tesis.firebasestorage.app",
            messagingSenderId: "740005254003",
            appId: "1:740005254003:web:abc24c84156d1f9e696b06"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // ==========================================
        // LÓGICA DE LA CÁMARA (FOTOGRAFÍA)
        // ==========================================
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const photoPreview = document.getElementById('photoPreview');
        const cameraUI = document.getElementById('cameraUI');
        const btnActivar = document.getElementById('btnActivarCam');
        const btnTomar = document.getElementById('btnTomarFoto');
        
        let stream = null;
        let facingMode = "user"; // Cámara frontal por defecto

        async function encenderCamara() {
            if (stream) detenerCamara();
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                video.srcObject = stream;
                video.style.display = 'block';
                cameraUI.style.display = 'none';
                photoPreview.style.display = 'none';
                btnActivar.style.display = 'none';
                btnTomar.style.display = 'inline-flex';
            } catch (err) {
                alert("No se pudo acceder a la cámara. Asegúrese de dar permisos.");
            }
        }

        function detenerCamara() {
            if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
        }

        document.getElementById('btnActivarCam').addEventListener('click', encenderCamara);
        
        document.getElementById('btnGirarCam').addEventListener('click', () => {
            facingMode = facingMode === "user" ? "environment" : "user";
            if(stream) encenderCamara();
        });

        document.getElementById('btnTomarFoto').addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photoPreview.src = canvas.toDataURL('image/png');
            photoPreview.style.display = 'block';
            video.style.display = 'none';
            btnTomar.style.display = 'none';
            btnActivar.style.display = 'inline-flex';
            detenerCamara();
        });

        window.subirFotoArchivo = function(event) {
            detenerCamara();
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    photoPreview.src = e.target.result;
                    photoPreview.style.display = 'block';
                    cameraUI.style.display = 'none';
                    video.style.display = 'none';
                    btnTomar.style.display = 'none';
                    btnActivar.style.display = 'inline-flex';
                };
                reader.readAsDataURL(file);
            }
        };

        window.limpiarFoto = function() {
            detenerCamara();
            photoPreview.src = "";
            photoPreview.style.display = "none";
            video.style.display = "none";
            cameraUI.style.display = "block";
            btnTomar.style.display = 'none';
            btnActivar.style.display = 'inline-flex';
            document.getElementById('fileInput').value = "";
        };

        // ==========================================
        // LÓGICA DEL LIENZO DE FIRMA (CANVAS)
        // ==========================================
        const sigCanvas = document.getElementById('signatureCanvas');
        const sigCtx = sigCanvas.getContext('2d');
        let isDrawing = false;
        let hasSignature = false;

        function resizeCanvas() {
            const rect = sigCanvas.parentElement.getBoundingClientRect();
            sigCanvas.width = rect.width;
            sigCanvas.height = rect.height;
        }
        setTimeout(resizeCanvas, 100); 

        function getPos(evt) {
            const rect = sigCanvas.getBoundingClientRect();
            if (evt.touches) {
                return { x: evt.touches[0].clientX - rect.left, y: evt.touches[0].clientY - rect.top };
            }
            return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
        }

        function startDrawing(e) {
            isDrawing = true;
            hasSignature = true;
            sigCtx.beginPath();
            const pos = getPos(e);
            sigCtx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            sigCtx.lineTo(pos.x, pos.y);
            sigCtx.strokeStyle = "#003f6b";
            sigCtx.lineWidth = 3;
            sigCtx.lineCap = "round";
            sigCtx.stroke();
            e.preventDefault();
        }

        function stopDrawing() { isDrawing = false; }

        sigCanvas.addEventListener('mousedown', startDrawing);
        sigCanvas.addEventListener('mousemove', draw);
        sigCanvas.addEventListener('mouseup', stopDrawing);
        sigCanvas.addEventListener('mouseout', stopDrawing);

        sigCanvas.addEventListener('touchstart', startDrawing, {passive: false});
        sigCanvas.addEventListener('touchmove', draw, {passive: false});
        sigCanvas.addEventListener('touchend', stopDrawing);

        window.limpiarFirma = function() {
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            hasSignature = false;
        };

        // ==========================================
        // LÓGICA DE GUARDADO EN FIREBASE
        // ==========================================
        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
            return new Blob([ab], {type: mimeString});
        }

        document.getElementById('registroPaciente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.innerText = "Guardando e integrando imágenes...";
            btn.disabled = true;

            try {
                let selfieUrl = "";
                let firmaUrl = "";

                if (photoPreview.src && photoPreview.style.display !== 'none') {
                    const selfieBlob = dataURItoBlob(photoPreview.src);
                    const selfieRef = ref(storage, 'pacientes/selfies/' + Date.now() + '.png');
                    await uploadBytes(selfieRef, selfieBlob);
                    selfieUrl = await getDownloadURL(selfieRef);
                }

                if (hasSignature) {
                    const firmaBlob = dataURItoBlob(sigCanvas.toDataURL("image/png"));
                    const firmaRef = ref(storage, 'pacientes/firmas/' + Date.now() + '.png');
                    await uploadBytes(firmaRef, firmaBlob);
                    firmaUrl = await getDownloadURL(firmaRef);
                }

                // Guardar Nombre Dividido en Firestore (Asegurando Mayúsculas)
                const docRef = await addDoc(collection(db, "pacientes"), {
                    nombre: document.getElementById('nombre').value.toUpperCase(),
                    apellidoPaterno: document.getElementById('apellidoPaterno').value.toUpperCase(),
                    apellidoMaterno: document.getElementById('apellidoMaterno').value.toUpperCase(),
                    curp: document.getElementById('curp').value.toUpperCase(),
                    sexo: document.getElementById('sexo').value,
                    fechaNac: document.getElementById('fechaNac').value,
                    calle: document.getElementById('calle').value.toUpperCase(),
                    numExt: document.getElementById('numExt').value.toUpperCase(),
                    colonia: document.getElementById('colonia').value.toUpperCase(),
                    municipio: document.getElementById('municipio').value.toUpperCase(),
                    cp: document.getElementById('cp').value,
                    estado: document.getElementById('estado').value,
                    selfieUrl: selfieUrl,
                    firmaUrl: firmaUrl,
                    fechaRegistro: new Date().toISOString()
                });

                alert("Expediente creado. ID Oficial: " + docRef.id);
                
                document.getElementById('registroPaciente').reset();
                limpiarFoto();
                limpiarFirma();

            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Ocurrió un error: " + error.message);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Registro y Generar ID';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
