<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --icest-blue: #005B9A; 
            --icest-dark: #003f6b; 
            --loreto-cyan: #81D0DC; 
            --bg-light: #f8fafc; 
            --text-main: #1e293b; 
            --text-muted: #64748b; 
        }
        body { font-family: 'Lato', sans-serif; color: var(--text-main); margin: 0; padding: 40px; display: flex; justify-content: center; background: transparent; }
        h3 { font-family: 'Poppins'; color: var(--icest-blue); margin-bottom: 15px; }
        .slide-card { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); border-top: 5px solid var(--icest-blue); width: 100%; max-width: 1100px; }
        .slide-title { font-size: 30px; font-family: 'Poppins'; margin-bottom: 25px; border-bottom: 2px solid var(--loreto-cyan); padding-bottom: 10px; color: var(--icest-blue); }
        
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; font-family: 'Lato'; background-color: var(--bg-light); font-size: 14px; }
        .form-control:focus { border-color: var(--loreto-cyan); outline: none; background-color: white; }
        .form-label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
        
        .btn-primary { background-color: var(--icest-blue); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; font-family: 'Poppins'; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary:hover { background-color: var(--icest-dark); transform: translateY(-2px); }
        
        /* Sistema de Grillas */
        .grid-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col-12 { flex: 0 0 100%; }
        .col-6 { flex: 1; min-width: 250px; }
        .col-4 { flex: 1; min-width: 180px; }

        .section-header { margin-top: 20px; padding-bottom: 5px; border-bottom: 1px solid #e2e8f0; margin-bottom: 15px; color: var(--icest-dark); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-header i { color: var(--loreto-cyan); }

        @media (max-width: 768px) {
            body { padding: 15px; }
            .slide-card { padding: 25px 20px; }
            .slide-title { font-size: 24px; }
            .grid-row { flex-direction: column; gap: 0; }
            .col-6, .col-4 { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="slide-card">
        <h2 class="slide-title">Registro de Nuevo Ingreso</h2>
        
        <form id="registroPaciente">
            <div class="section-header"><i class="fa-solid fa-user"></i> Datos Personales</div>
            
            <div class="grid-row">
                <div class="col-12">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" placeholder="Nombre(s) y Apellidos">
                </div>
            </div>

            <div class="grid-row">
                <div class="col-12">
                    <label class="form-label">CURP</label>
                    <input type="text" class="form-control" placeholder="18 caracteres alfanuméricos">
                </div>
            </div>

            <div class="grid-row">
                <div class="col-6">
                    <label class="form-label">Sexo</label>
                    <select class="form-control">
                        <option value="">Seleccione...</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="O">Otro</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-control">
                </div>
            </div>

            <div class="section-header"><i class="fa-solid fa-house-medical"></i> Domicilio del Paciente</div>
            
            <div class="grid-row">
                <div class="col-6">
                    <label class="form-label">Calle y Números</label>
                    <input type="text" class="form-control" placeholder="Nombre de la vialidad">
                </div>
                <div class="col-6">
                    <label class="form-label">Número Exterior</label>
                    <input type="text" class="form-control" placeholder="Ej. 123-A o S/N">
                </div>
            </div>

            <div class="grid-row">
                <div class="col-6">
                    <label class="form-label">Colonia</label>
                    <input type="text" class="form-control" placeholder="Nombre del asentamiento">
                </div>
                <div class="col-6">
                    <label class="form-label">Delegación o Municipio</label>
                    <input type="text" class="form-control" placeholder="Municipio">
                </div>
            </div>

            <div class="grid-row">
                <div class="col-6">
                    <label class="form-label">Código Postal</label>
                    <input type="number" class="form-control" placeholder="5 dígitos">
                </div>
                <div class="col-6">
                    <label class="form-label">Estado</label>
                    <select class="form-control">
                        <option value="">Seleccione un estado...</option>
                        <option value="Aguascalientes">Aguascalientes</option>
                        <option value="Baja California">Baja California</option>
                        <option value="Baja California Sur">Baja California Sur</option>
                        <option value="Campeche">Campeche</option>
                        <option value="Chiapas">Chiapas</option>
                        <option value="Chihuahua">Chihuahua</option>
                        <option value="Ciudad de México">Ciudad de México</option>
                        <option value="Coahuila">Coahuila</option>
                        <option value="Colima">Colima</option>
                        <option value="Durango">Durango</option>
                        <option value="Estado de México">Estado de México</option>
                        <option value="Guanajuato">Guanajuato</option>
                        <option value="Guerrero">Guerrero</option>
                        <option value="Hidalgo">Hidalgo</option>
                        <option value="Jalisco">Jalisco</option>
                        <option value="Michoacán">Michoacán</option>
                        <option value="Morelos">Morelos</option>
                        <option value="Nayarit">Nayarit</option>
                        <option value="Nuevo León">Nuevo León</option>
                        <option value="Oaxaca">Oaxaca</option>
                        <option value="Puebla">Puebla</option>
                        <option value="Querétaro">Querétaro</option>
                        <option value="Quintana Roo">Quintana Roo</option>
                        <option value="San Luis Potosí">San Luis Potosí</option>
                        <option value="Sinaloa">Sinaloa</option>
                        <option value="Sonora">Sonora</option>
                        <option value="Tabasco">Tabasco</option>
                        <option value="Tamaulipas">Tamaulipas</option>
                        <option value="Tlaxcala">Tlaxcala</option>
                        <option value="Veracruz">Veracruz</option>
                        <option value="Yucatán">Yucatán</option>
                        <option value="Zacatecas">Zacatecas</option>
                    </select>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Registro y Generar ID
                </button>
            </div>
        </form>
    </div>
</body>
</html>
